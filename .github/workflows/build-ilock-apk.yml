name: Build iLock Liquid Glass APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ilock-project/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: ilock-project
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ilock-liquid-glass-debug
          path: ilock-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
