<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>SKMOD — Maintenance</title><link rel="stylesheet" href="css/theme.css"><style>body{display:grid;place-items:center;min-height:100vh;padding:20px}.maintenance{width:min(680px,100%);text-align:center;padding:42px 24px}.orb{width:86px;height:86px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;font-size:36px;background:linear-gradient(135deg,#ffffff2e,#ffffff08);border:1px solid #ffffff22;box-shadow:0 20px 60px #0007}.maintenance h1{font-size:34px;margin:0 0 10px}.maintenance p{color:#9da7bb;line-height:1.7}.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:10px 14px;border-radius:999px;background:#ffffff0b;border:1px solid #ffffff18;font-size:12px;color:#cbd3e4}.dot{width:8px;height:8px;border-radius:50%;background:#ffb84d;box-shadow:0 0 14px #ffb84d}</style></head><body><main class="maintenance glass"><div class="orb">🛠️</div><span>SKMOD</span><h1>We'll be back soon.</h1><p id="message">SKMOD is temporarily under maintenance while we improve the store. Please check back shortly.</p><div class="status"><i class="dot"></i> Maintenance in progress</div></main><script>(async()=>{try{const r=await fetch('https://gwcvbzpeuoqbitmicnzc.supabase.co/rest/v1/site_settings?id=eq.global&select=maintenance_mode,maintenance_message&_='+Date.now(),{headers:{apikey:'sb_publishable_M297ppCef4OMWIAVoI5qxQ_bxZPROlR',Accept:'application/json'},cache:'no-store'});if(!r.ok)return;const d=await r.json();const s=d[0];if(s?.maintenance_mode!==true){location.replace('app/home.html');return}if(s.maintenance_message)document.querySelector('#message').textContent=s.maintenance_message}catch(e){console.warn('SKMOD maintenance status unavailable',e)}})();</script></body></html>
