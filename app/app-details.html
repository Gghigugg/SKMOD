<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>App Details — SKMOD</title><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/app-details.css"></head><body><script src="../js/maintenance-check.js"></script><main class="details"><a class="back" href="javascript:history.back()">← Back</a><section id="app-detail" class="detail-top glass"><div class="app-icon">◈</div><div class="meta"><h1>Loading app…</h1><p>SKMOD</p></div></section><div id="app-stats" class="stats"></div><a id="download" class="download" href="#" aria-disabled="true">APK not available</a><section class="panel glass"><h2>About this app</h2><p id="description">Loading app information…</p></section><section class="panel glass"><h2>App information</h2><div id="features" class="features"></div></section></main><script>const name=new URLSearchParams(location.search).get('app');const detail=document.querySelector('#app-detail'),stats=document.querySelector('#app-stats'),description=document.querySelector('#description'),features=document.querySelector('#features'),download=document.querySelector('#download');const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const r=await fetch('../data/apps.json',{cache:'no-store'});const apps=await r.json();const a=apps.find(x=>String(x.name).toLowerCase()===String(name||'').toLowerCase());if(!a){detail.innerHTML='<div class="meta"><h1>App not found</h1><p>This app is not available in the SKMOD catalog.</p></div>';return}document.title=`${a.name} — SKMOD`;detail.innerHTML=`<div class="app-icon">${esc(a.icon||'◈')}</div><div class="meta"><h1>${esc(a.name)}</h1><p>${esc(a.developer||'SKMOD')}</p><div class="rating">★ ${esc(a.rating||'New')}</div></div>`;stats.innerHTML=`<div class="stat"><b>${esc(a.version||'Latest')}</b><span>VERSION</span></div><div class="stat"><b>${esc(a.size||'—')}</b><span>SIZE</span></div><div class="stat"><b>${esc(a.downloads||'—')}</b><span>DOWNLOADS</span></div>`;description.textContent=a.description||`${a.name} is available in the SKMOD catalog.`;features.innerHTML=`<div class="feature">✓ Category: ${esc(a.category||'Apps')}</div><div class="feature">✓ Developer: ${esc(a.developer||'SKMOD')}</div><div class="feature">✓ Rating: ${esc(a.rating||'New')}</div>`}catch(e){detail.innerHTML='<div class="meta"><h1>Unable to load app</h1><p>Please refresh and try again.</p></div>'}}load();</script></body></html>
