<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>App Details — SKMOD</title><link rel="stylesheet" href="../css/theme.css"><link rel="stylesheet" href="../css/app-details.css"></head><body><script src="../js/maintenance-check.js"></script><main class="details"><a class="back" href="home.html">← Back to SKMOD</a><section id="app-detail" class="detail-top glass"><div class="app-icon">◈</div><div class="meta"><h1>Loading app…</h1><p>SKMOD</p></div></section><div id="app-stats" class="stats"></div><section id="download-wrap"></section><section class="panel glass"><h2>About this app</h2><p id="description">Loading app information…</p></section><section id="features-panel" class="panel glass"><h2>App information</h2><div id="features" class="features"></div></section><section id="screenshots-panel" class="panel glass" hidden><h2>Screenshots</h2><div id="shots" class="shots"></div></section><section class="panel glass"><h2>SKMOD note</h2><p class="muted">Only APK links provided in the catalog are downloadable. SKMOD does not invent or generate APK files.</p></section></main><nav class="bottom-nav"><a href="home.html">⌂<small>Home</small></a><a href="categories.html">▦<small>Categories</small></a><a href="search.html">⌕<small>Search</small></a><a href="notifications.html">♢<small>Alerts</small></a><a href="profile.html">◉<small>Profile</small></a></nav><script>const name=new URLSearchParams(location.search).get('app');const detail=document.querySelector('#app-detail'),stats=document.querySelector('#app-stats'),description=document.querySelector('#description'),features=document.querySelector('#features'),downloadWrap=document.querySelector('#download-wrap'),shotsPanel=document.querySelector('#screenshots-panel'),shots=document.querySelector('#shots');const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function validUrl(v){try{const u=new URL(v,location.href);return ['http:','https:'].includes(u.protocol)||u.origin===location.origin}catch{return false}}async function load(){try{const r=await fetch('../data/apps.json',{cache:'no-store'});if(!r.ok)throw Error();const apps=await r.json();const a=apps.find(x=>String(x.name).toLowerCase()===String(name||'').toLowerCase());if(!a){detail.innerHTML='<div class="meta"><h1>App not found</h1><p>This app is not available in the SKMOD catalog.</p></div>';stats.innerHTML='';downloadWrap.innerHTML='<a class="download disabled" href="search.html">Browse SKMOD Apps</a>';return}document.title=`${a.name} — SKMOD`;detail.innerHTML=`<div class="app-icon">${esc(a.icon||'◈')}</div><div class="meta"><h1>${esc(a.name)}</h1><p>${esc(a.developer||'SKMOD')}</p><div class="rating">★ ${esc(a.rating||'New')}</div></div>`;stats.innerHTML=`<div class="stat"><b>${esc(a.version||'Latest')}</b><span>VERSION</span></div><div class="stat"><b>${esc(a.size||'—')}</b><span>SIZE</span></div><div class="stat"><b>${esc(a.downloads||'—')}</b><span>DOWNLOADS</span></div>`;description.textContent=a.description||`${a.name} is available in the SKMOD catalog.`;const featureItems=[`Category: ${a.category||'Apps'}`,`Developer: ${a.developer||'SKMOD'}`,`Rating: ${a.rating??'New'}`,`Version: ${a.version||'Latest'}`];if(a.modFeatures)featureItems.push(`Mod features: ${a.modFeatures}`);features.innerHTML=featureItems.map(x=>`<div class="feature">✓ ${esc(x)}</div>`).join('');const apk=String(a.apkUrl||'').trim();if(validUrl(apk)){downloadWrap.innerHTML=`<a class="download" href="${esc(apk)}" target="_blank" rel="noopener noreferrer" download>Download APK</a>`}else{downloadWrap.innerHTML='<div class="download disabled">APK not available</div>'}const list=Array.isArray(a.screenshots)?a.screenshots.filter(validUrl).slice(0,8):[];if(list.length){shots.innerHTML=list.map((src,i)=>`<img class="shot" src="${esc(src)}" alt="${esc(a.name)} screenshot ${i+1}" loading="lazy">`).join('');shotsPanel.hidden=false}}catch(e){detail.innerHTML='<div class="meta"><h1>Unable to load app</h1><p>Please refresh and try again.</p></div>';stats.innerHTML='';downloadWrap.innerHTML='<div class="download disabled">Catalog unavailable</div>'}}load();</script></body></html>
