<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Maintenance — SKMOD</title>
<link rel="stylesheet" href="../css/global.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:18px;overflow:hidden;background:#000}.maintenance{width:min(620px,100%);padding:42px 24px;text-align:center;border:1px solid rgba(255,255,255,.14);border-radius:34px;background:rgba(255,255,255,.055);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 30px 100px rgba(0,0,0,.7)}.orb{width:86px;height:86px;margin:0 auto 22px;border-radius:28px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16)}.eyebrow{font-size:11px;letter-spacing:.2em;opacity:.6}.maintenance h1{font-size:clamp(30px,8vw,54px);margin:10px 0}.maintenance p{max-width:460px;margin:0 auto;color:#aab4c8;line-height:1.65}.status{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 15px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#ffbf69;box-shadow:0 0 16px rgba(255,191,105,.8)}.brand{margin-top:30px;font-weight:800;letter-spacing:.12em;opacity:.75}
</style>
</head>
<body>
<main class="maintenance"><div class="orb">🛠️</div><div class="eyebrow">SKMOD • SYSTEM UPDATE</div><h1>We’ll be back soon.</h1><p id="message">SKMOD is temporarily under maintenance while we improve the store experience. Please check back shortly.</p><div class="status"><span class="dot"></span> Maintenance in progress</div><div class="brand">SKMOD</div></main>
<script>(async()=>{try{const r=await fetch('https://gwcvbzpeuoqbitmicnzc.supabase.co/rest/v1/site_settings?id=eq.global&select=maintenance_mode,maintenance_message&_='+Date.now(),{headers:{apikey:'sb_publishable_M297ppCef4OMWIAVoI5qxQ_bxZPROlR',Accept:'application/json'},cache:'no-store'});if(!r.ok)return;const d=await r.json();const s=d[0];if(s?.maintenance_mode!==true){location.replace('home.html');return}if(s.maintenance_message)document.querySelector('#message').textContent=s.maintenance_message}catch(e){console.warn('SKMOD maintenance status unavailable',e)}})();</script>
</body>
</html>
