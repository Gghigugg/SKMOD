<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Upload APK — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><script src="guard.js"></script><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>UPLOAD</span></header><section class="admin-hero glass"><span>APP PUBLISHER</span><h1>Upload APK</h1><p>Create an app listing. The selected APK is validated here, but static GitHub hosting cannot store it as a real download.</p></section><form id="form" class="form-card glass"><div class="form-grid"><label>App name<input id="name" required maxlength="80" placeholder="e.g. Pixel Racer"></label><label>Developer<input id="developer" maxlength="80" placeholder="Developer name"></label><label>Category<select id="category"><option>Games</option><option>Apps</option><option>Tools</option><option>Entertainment</option></select></label><label>Version<input id="version" maxlength="30" placeholder="1.0.0"></label><label>Size<input id="size" maxlength="30" placeholder="50 MB"></label><label>Rating<input id="rating" type="number" min="0" max="5" step="0.1" placeholder="4.8"></label><label>APK file<input id="apk" type="file" accept=".apk,application/vnd.android.package-archive" required></label><label>Description<textarea id="description" maxlength="1000" placeholder="Describe the app..."></textarea></label><button id="publish" class="admin-action" type="submit">Publish Listing</button><div id="status" class="notice" hidden></div></div></form></main><script>const f=document.querySelector('#form'),s=document.querySelector('#status'),button=document.querySelector('#publish');function show(t){s.hidden=false;s.textContent=t}f.addEventListener('submit',e=>{e.preventDefault();const file=document.querySelector('#apk').files[0];if(!file){show('Select an APK file first.');return}if(!file.name.toLowerCase().endsWith('.apk')){show('Only .apk files are allowed.');return}if(file.size===0){show('The selected APK is empty.');return}const item={name:document.querySelector('#name').value.trim(),developer:document.querySelector('#developer').value.trim()||'SKMOD Developer',category:document.querySelector('#category').value,version:document.querySelector('#version').value.trim()||'1.0.0',size:document.querySelector('#size').value.trim()||'—',rating:Math.min(5,Math.max(0,Number(document.querySelector('#rating').value)||0)),icon:'◈',downloads:'0',dateAdded:new Date().toISOString().slice(0,10),description:document.querySelector('#description').value.trim(),apkName:file.name};if(!item.name){show('Enter an app name.');return}const saved=JSON.parse(localStorage.getItem('skmod_admin_apps')||'[]');const duplicate=saved.some(x=>x.name.toLowerCase()===item.name.toLowerCase());if(duplicate){show('An app with this name already exists in local admin listings.');return}saved.push(item);localStorage.setItem('skmod_admin_apps',JSON.stringify(saved));show('Listing saved locally. Real APK hosting still requires storage/backend.');f.reset()});</script></body></html>
