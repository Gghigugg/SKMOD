<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload APK — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>UPLOAD</span></header><section class="admin-hero glass"><span>APP PUBLISHER</span><h1>Upload APK</h1><p>Create a complete app listing. APK files are selected locally; publishing to a real download server requires storage/backend.</p></section><form id="form" class="form-card glass"><div class="form-grid"><label>App name<input id="name" required placeholder="e.g. Pixel Racer"></label><label>Developer<input id="developer" placeholder="Developer name"></label><label>Category<select id="category"><option>Games</option><option>Apps</option><option>Tools</option><option>Entertainment</option></select></label><label>Version<input id="version" placeholder="1.0.0"></label><label>Size<input id="size" placeholder="50 MB"></label><label>Rating<input id="rating" type="number" min="0" max="5" step="0.1" placeholder="4.8"></label><label>APK file<input id="apk" type="file" accept=".apk" required></label><label>Description<textarea id="description" placeholder="Describe the app..."></textarea></label><button class="admin-action" type="submit">Publish Listing</button><div id="status" class="notice" hidden></div></div></form></main><script>const f=document.querySelector('#form'),s=document.querySelector('#status');f.onsubmit=e=>{e.preventDefault();const file=document.querySelector('#apk').files[0];const item={name:name.value.trim(),developer:developer.value.trim()||'SKMOD Developer',category:category.value,version:version.value.trim()||'1.0.0',size:size.value.trim()||'—',rating:Number(rating.value)||0,icon:'◈',downloads:'0'};if(!file)return;const saved=JSON.parse(localStorage.getItem('skmod_admin_apps')||'[]');saved.push({...item,apkName:file.name});localStorage.setItem('skmod_admin_apps',JSON.stringify(saved));s.hidden=false;s.textContent='Listing saved locally in this browser. Connect Supabase/storage later for real APK hosting.';f.reset()}</script></body></html>
