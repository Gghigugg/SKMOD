<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>APPS</span></header><section class="admin-hero glass"><span>CONTENT MANAGER</span><h1>Manage Apps</h1><p>Search, inspect and manage your store catalog.</p></section><div class="toolbar glass"><input id="q" placeholder="Search apps…"><a class="admin-action" href="upload.html">＋ Add App</a></div><section id="list" class="data-list"></section></main><script>const list=document.querySelector('#list'),q=document.querySelector('#q');let apps=[];function render(){const s=(q.value||'').toLowerCase();const a=apps.filter(x=>(x.name+' '+x.category+' '+(x.developer||'')).toLowerCase().includes(s));list.innerHTML=a.map((x,i)=>`<article class="data-row glass"><div class="row-icon">${x.icon||'◈'}</div><div class="row-copy"><strong>${x.name}</strong><span>${x.category||'Apps'} · ${x.version||'Latest'} · ${x.size||'—'} · ★ ${x.rating||'New'}</span><small>${x.developer||'Unknown developer'} · ${x.downloads||'0'} downloads</small></div><a class="admin-action small" href="../app/app-details.html?app=${encodeURIComponent(x.name)}">View</a></article>`).join('')||'<div class="empty glass">No apps found.</div>'}fetch('../data/apps.json').then(r=>r.json()).then(x=>{apps=x;render()});q.oninput=render;</script></body></html>
