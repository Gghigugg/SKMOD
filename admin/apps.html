<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Apps — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><script src="guard.js"></script><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>APPS</span></header><section class="admin-hero glass"><span>CONTENT MANAGER</span><h1>Manage Apps</h1><p>Search, inspect, publish and remove local catalog listings.</p></section><div class="toolbar glass"><input id="q" placeholder="Search apps…" autocomplete="off"><select id="cat"><option>All categories</option><option>Games</option><option>Apps</option><option>Tools</option><option>Entertainment</option></select><a class="admin-action" href="upload.html">＋ Add App</a></div><section id="list" class="data-list"></section></main><script>const list=document.querySelector('#list'),q=document.querySelector('#q'),cat=document.querySelector('#cat');let apps=[];function local(){try{return JSON.parse(localStorage.getItem('skmod_admin_apps')||'[]')}catch{return[]}}function save(a){localStorage.setItem('skmod_admin_apps',JSON.stringify(a))}function esc(v){return String(v??'').replace(/[&<>\'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function render(){const s=(q.value||'').toLowerCase().trim(),c=cat.value;const a=apps.filter(x=>(c==='All categories'||x.category===c)&&(x.name+' '+x.category+' '+(x.developer||'')).toLowerCase().includes(s));list.innerHTML=a.map(x=>`<article class="data-row glass"><div class="row-icon">${esc(x.icon||'◈')}</div><div class="row-copy"><strong>${esc(x.name)}</strong><span>${esc(x.category||'Apps')} · ${esc(x.version||'Latest')} · ${esc(x.size||'—')} · ★ ${esc(x.rating||'New')}</span><small>${esc(x.developer||'Unknown developer')} · ${esc(x.downloads||'0')} downloads${x.apkName?' · '+esc(x.apkName):''}</small></div><a class="admin-action small" href="../app/app-details.html?app=${encodeURIComponent(x.name)}">View</a>${x.local?`<button class="admin-action small danger" data-name="${encodeURIComponent(x.name)}">Delete</button>`:''}</article>`).join('')||'<div class="empty glass">No apps found.</div>';document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{const name=decodeURIComponent(b.dataset.name);if(!confirm(`Delete ${name} from local admin listings?`))return;save(local().filter(x=>x.name!==name));load()})}async function load(){try{const r=await fetch('../data/apps.json',{cache:'no-store'});if(!r.ok)throw Error();const base=await r.json();apps=[...base.map(x=>({...x,local:false})),...local().map(x=>({...x,local:true}))];render()}catch(e){list.innerHTML='<div class="empty glass">Unable to load the app catalog.</div>'}}q.oninput=render;cat.onchange=render;load();</script></body></html>
