<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Apps — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>APPS</span></header><section class="admin-hero glass"><span>CONTENT MANAGER</span><h1>Manage Apps</h1><p>Search, inspect, publish and remove catalog listings.</p></section><div class="toolbar glass"><input id="q" placeholder="Search apps…"><select id="cat"><option>All categories</option><option>Games</option><option>Apps</option><option>Tools</option><option>Entertainment</option></select><a class="admin-action" href="upload.html">＋ Add App</a></div><section id="list" class="data-list"></section></main><script>const list=document.querySelector('#list'),q=document.querySelector('#q'),cat=document.querySelector('#cat');let apps=[];function local(){return JSON.parse(localStorage.getItem('skmod_admin_apps')||'[]')}function save(a){localStorage.setItem('skmod_admin_apps',JSON.stringify(a))}function render(){const s=(q.value||'').toLowerCase(),c=cat.value;const a=apps.filter(x=>(c==='All categories'||x.category===c)&&(x.name+' '+x.category+' '+(x.developer||'')).toLowerCase().includes(s));list.innerHTML=a.map((x,i)=>`<article class="data-row glass"><div class="row-icon">${x.icon||'◈'}</div><div class="row-copy"><strong>${x.name}</strong><span>${x.category||'Apps'} · ${x.version||'Latest'} · ${x.size||'—'} · ★ ${x.rating||'New'}</span><small>${x.developer||'Unknown developer'} · ${x.downloads||'0'} downloads${x.apkName?' · '+x.apkName:''}</small></div><a class="admin-action small" href="../app/app-details.html?app=${encodeURIComponent(x.name)}">View</a>${x.local?<button class="admin-action small danger" data-remove="${i}">Delete</button>:''}</article>`).join('')||'<div class="empty glass">No apps found.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const localApps=local();localApps.splice(Number(b.dataset.remove),1);save(localApps);load()})}function load(){Promise.all([fetch('../data/apps.json').then(r=>r.json()),Promise.resolve(local())]).then(([base,extra])=>{apps=[...base.map(x=>({...x,local:false})),...extra.map(x=>({...x,local:true}))];render()})}q.oninput=render;cat.onchange=render;load();</script></body></html>
