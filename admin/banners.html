<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Banners — SKMOD Admin</title><link rel="stylesheet" href="../css/admin.css"></head><body><script src="guard.js"></script><main class="admin-page"><header class="admin-top glass"><a href="index.html">← SKMOD</a><span>BANNERS</span></header><section class="admin-hero glass"><span>PROMOTIONS</span><h1>Banner Manager</h1><p>Create and preview a banner for this browser. Server-wide publishing requires connected storage.</p></section><section id="preview" class="banner-preview glass"><strong id="previewTitle">🚀 Featured on SKMOD</strong><span id="previewSubtitle">Promote a new app, game or collection here.</span></section><form id="form" class="form-card glass" style="margin-top:16px"><div class="form-grid"><label>Banner title<input id="title" maxlength="100" placeholder="Featured collection"></label><label>Subtitle<input id="subtitle" maxlength="180" placeholder="Discover something new"></label><label>Destination URL<input id="url" maxlength="300" placeholder="../app/app-details.html?app=..."></label><button class="admin-action" type="submit">Save Banner</button><div id="status" class="notice" hidden></div></div></form></main><script>const key='skmod_admin_banner';const form=document.querySelector('#form'),status=document.querySelector('#status'),title=document.querySelector('#title'),subtitle=document.querySelector('#subtitle'),url=document.querySelector('#url');const pt=document.querySelector('#previewTitle'),ps=document.querySelector('#previewSubtitle');function load(){try{const b=JSON.parse(localStorage.getItem(key)||'null');if(!b)return;title.value=b.title||'';subtitle.value=b.subtitle||'';url.value=b.url||'';pt.textContent=b.title||'🚀 Featured on SKMOD';ps.textContent=b.subtitle||'Promote a new app, game or collection here.'}catch{}}form.addEventListener('submit',e=>{e.preventDefault();const b={title:title.value.trim()||'🚀 Featured on SKMOD',subtitle:subtitle.value.trim()||'Promote a new app, game or collection here.',url:url.value.trim()};if(b.url&&!/^(https?:\/\/|\.\.?\/|\/)/i.test(b.url)){status.hidden=false;status.textContent='Destination must be a valid http(s) or relative URL.';return}localStorage.setItem(key,JSON.stringify(b));pt.textContent=b.title;ps.textContent=b.subtitle;status.hidden=false;status.textContent='Banner saved on this admin browser.'});load();</script></body></html>
