<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Reset Password — SKMOD</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><section class="form-card glass admin-login"><div class="admin-hero"><span>SKMOD CONTROL CENTER</span><h1>Set new password</h1><p>Choose a new password for the authorized admin account.</p></div><form id="reset-form" novalidate><label>New password<input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Minimum 8 characters"></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Re-enter new password"></label><button class="admin-action" id="submit" type="submit">Update password</button><div id="status" class="notice" hidden></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient('https://gwcvbzpeuoqbitmicnzc.supabase.co','sb_publishable_M297ppCef4OMWIAVoI5qxQ_bxZPROlR',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.querySelector('#reset-form'),status=document.querySelector('#status'),submit=document.querySelector('#submit');function show(message){status.hidden=false;status.textContent=message}async function ready(){const {data}=await client.auth.getSession();if(!data?.session)show('This reset link is invalid or expired. Request a new password reset email.')}ready();form.addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value,confirm=document.querySelector('#confirm').value;if(password.length<8){show('Password must be at least 8 characters.');return}if(password!==confirm){show('Passwords do not match.');return}submit.disabled=true;submit.textContent='Updating…';const {error}=await client.auth.updateUser({password});if(error){show('Password update failed. The reset link may be expired.');submit.disabled=false;submit.textContent='Update password';return}show('✓ Password updated successfully. Redirecting to Admin Login…');await client.auth.signOut();setTimeout(()=>location.href='login.html',1200)});</script></body></html>
