<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b14"><title>Admin Login — SKMOD</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><section class="form-card glass admin-login"><div class="admin-hero"><span>SKMOD CONTROL CENTER</span><h1>Admin Login</h1><p>Sign in to manage the SKMOD store.</p></div><form id="login"><label>Username<input id="username" autocomplete="username" required placeholder="Admin username"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Admin password"></label><button class="admin-action" type="submit">Sign in</button><div id="status" class="notice" hidden></div></form></section></main><script>const form=document.querySelector('#login'),status=document.querySelector('#status');form.onsubmit=e=>{e.preventDefault();const u=document.querySelector('#username').value.trim(),p=document.querySelector('#password').value;if(u==='admin'&&p==='skmod@admin'){sessionStorage.setItem('skmod_admin_auth','true');location.replace('index.html')}else{status.hidden=false;status.textContent='Invalid admin credentials.'}};</script></body></html>
