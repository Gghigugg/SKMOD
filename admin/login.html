<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Admin Login — SKMOD</title><link rel="stylesheet" href="../css/admin.css"></head><body><main class="admin-page"><section class="form-card glass admin-login"><div class="admin-hero"><span>SKMOD CONTROL CENTER</span><h1>Admin Login</h1><p>Secure admin access for SKMOD.</p></div><form id="login" novalidate><label>Admin email<input id="email" type="email" autocomplete="username" value="ramdattkohali143@gmail.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Admin password"></label><button class="admin-action" id="submit" type="submit">Sign in securely</button><div id="status" class="notice" hidden></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://gwcvbzpeuoqbitmicnzc.supabase.co';const SUPABASE_KEY='sb_publishable_M297ppCef4OMWIAVoI5qxQ_bxZPROlR';const ADMIN_EMAIL='ramdattkohali143@gmail.com';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const form=document.querySelector('#login'),status=document.querySelector('#status'),submit=document.querySelector('#submit');function show(message){status.hidden=false;status.textContent=message}form.addEventListener('submit',async e=>{e.preventDefault();status.hidden=true;submit.disabled=true;submit.textContent='Signing in…';const email=document.querySelector('#email').value.trim().toLowerCase();const password=document.querySelector('#password').value;if(email!==ADMIN_EMAIL){show('Use the authorized admin email.');submit.disabled=false;submit.textContent='Sign in securely';return}const {data,error}=await client.auth.signInWithPassword({email,password});if(error||!data?.session){show('Login failed. Check the admin email and password.');submit.disabled=false;submit.textContent='Sign in securely';return}const {data:sessionData}=await client.auth.getSession();if(sessionData.session?.user?.email?.toLowerCase()!==ADMIN_EMAIL){await client.auth.signOut();show('This account is not authorized for SKMOD admin access.');submit.disabled=false;submit.textContent='Sign in securely';return}sessionStorage.setItem('skmod_admin_auth','true');window.location.href='index.html'});</script></body></html>
